name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # gradle.properties pins the original development machine's Windows JDK
      # path (C:/Program Files/Android/Android Studio/jbr). It exists to work
      # around a Java 26 / AGP incompatibility on that machine and does not
      # exist on Linux. Removing it lets Gradle use the JDK 21 installed above.
      - name: Remove machine-specific JDK path
        run: sed -i '/^org\.gradle\.java\.home/d' gradle.properties

      # A release APK must be signed to install, and the key is not committed.
      # Restore it from repository secrets into the runner's temp directory, then
      # write keystore.properties for build.gradle.kts to read. Without secrets
      # (for example an external pull request) build a debug APK instead.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::No signing key; building a debug APK only"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      # Release builds enable R8: dex drops from 27 MB to about 2.3 MB. Debug
      # builds are not obfuscated and stay around 3-4 MB, so distributed builds
      # always use release.
      - name: Build
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew assembleRelease --console=plain
          else
            ./gradlew assembleDebug --console=plain
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
